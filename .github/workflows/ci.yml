name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm bundle:mcpb
      - run: pnpm smoke:mcpb
      - run: pnpm exec mcpb info artifacts/mcp-balena.mcpb
      - run: pnpm pack --pack-destination artifacts
      - name: Check container startup and auth
        run: |
          docker build -t balena-mcp-ci .
          docker run -d --name balena-mcp-ci -p 127.0.0.1:3010:3000 \
            -e BALENA_API_TOKEN=test-token -e MCP_HTTP_AUTH_TOKEN=test-mcp-token \
            balena-mcp-ci
          trap 'docker rm -f balena-mcp-ci' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3010/health; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3010/mcp)" = 401
